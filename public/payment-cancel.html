<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bisiro — Payment Cancelled</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/bisiro.css" />
  <script src="/bisiro-shell.js"></script>
</head>
<body>
<div id="bisiro-app" data-theme="blue" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="max-width:420px;width:100%;text-align:center;">

    <div style="width:64px;height:64px;border-radius:50%;background:rgba(217,138,31,0.12);border:2px solid #d98a1f;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px;">✕</div>

    <h1 class="bs-page-title" style="font-size:26px;margin-bottom:10px;">Payment cancelled</h1>
    <div style="font-size:14px;color:var(--text-dim);line-height:1.6;margin-bottom:28px;">
      Your payment was not completed. No charges were made. You can try again whenever you're ready.
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;">
      <a href="/credits.html" class="bs-btn-primary" style="text-decoration:none;justify-content:center;">Try again</a>
      <a href="/dashboard.html" class="bs-btn-ghost" style="text-decoration:none;justify-content:center;">Back to Dashboard</a>
    </div>

  </div>
</div>

<script>
BisiroShell.init({ role: 'owner', active: 'credits', user: {} });
</script>
</body>
</html>
